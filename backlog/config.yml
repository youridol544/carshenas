project_name: "Carshenas"
default_status: "To Do"
statuses: ["To Do", "In Progress", "In Review", "Done"]
labels: ["frontend", "backend", "database", "search", "crawler", "ai", "eval", "infra", "design", "i18n", "docs", "dx", "research", "demo"]
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "vim"
auto_open_browser: true
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "cs"
definition_of_done: ["Relevant checks pass (lint, typecheck, tests)", "Docs or ADRs updated when behavior or decisions changed", "No secrets or credentials committed"]
