# PostgreSQL 18 settings for Carshenas. The server shares one VPS with the web app and the worker, so these are
# the 4 GB column of the configuration table in the database skill (.claude/skills/database/references/craft.md,
# "Configuration"). CS-37 re-derives them for the real VPS. After a change: `pnpm db:restart`, then check with SHOW.
# This file replaces the image's postgresql.conf entirely: anything not set here is PostgreSQL's built-in default.

# Connections
listen_addresses = '*'                  # inside the container; compose.yaml publishes the port on 127.0.0.1 only
max_connections = 50                    # web pool 5 + worker pool 5 + job queue + migrations + psql, with headroom

# Memory
shared_buffers = 1GB                    # 25 % of RAM
effective_cache_size = 2GB              # a planner hint, not an allocation; 50 % because the box is shared
work_mem = 16MB                         # per sort or hash node, per connection; raise per session for batches
maintenance_work_mem = 256MB            # vacuum and index builds; raise per session for an HNSW build
autovacuum_work_mem = 128MB

# Planner, I/O and write-ahead log
random_page_cost = 1.1                  # SSD, data mostly cached
effective_io_concurrency = 16
jit = off                               # short OLTP queries pay JIT's compile time without gaining from it
max_wal_size = 2GB                      # fewer forced checkpoints during crawls
default_toast_compression = lz4         # snapshot payloads are large JSON

# Statistics: the workload view (pg_stat_statements) and slow plans (auto_explain), on from day one
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.track = top
track_io_timing = on

# Logging: slow statements, their plans, lock waits, spills to disk, slow autovacuum
log_min_duration_statement = 250ms      # per role where a process legitimately runs longer (the worker)
auto_explain.log_min_duration = 500ms
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = off           # per-node timing on every statement is the expensive part
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 1s
log_line_prefix = '%m [%p] %q%u@%d app=%a '
# Personal data stays out of the log where settings allow (ADR-0008 point 7): no bind parameters with logged
# statements, and no DETAIL lines (a constraint error's DETAIL prints the failing row). Plans that auto_explain logs
# still show the constants a query was planned with; CS-37 decides whether production keeps auto_explain.
# In development, CARSHENAS_LOG_SQL=1 logs parameters on the app side instead.
log_parameter_max_length = 0
auto_explain.log_parameter_max_length = 0
log_error_verbosity = terse

# Locale and time: instants are stored in UTC; Tehran days are computed with AT TIME ZONE 'Asia/Tehran' in queries.
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C.UTF-8'                 # English server messages; code reads SQLSTATE and constraint names only
default_text_search_config = 'pg_catalog.simple'   # Persian search uses 'simple'; always pass the config anyway
